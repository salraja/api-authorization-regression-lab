name: Authorization regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest
      - run: python -m authzlab --fixture secure --output-dir artifacts/secure
      - name: Check that the intentionally vulnerable fixture fails
        shell: bash
        run: |
          set +e
          python -m authzlab --fixture vulnerable --output-dir artifacts/vulnerable
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-evidence
          path: artifacts/
